<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Flap Steve — a silly little game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <canvas id="game" width="480" height="720" aria-label="Game canvas"></canvas>

    <div class="hud">
      <div class="score">
        <span id="score">0</span>
        <small>BEST <span id="best">0</span></small>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="panel">
        <h1>Flap Steve</h1>
        <p class="sub">Tap, click, or press <kbd>Space</kbd> to flap.</p>
        <p class="sub">Dodge the cobblestone pillars. Don't hit the ground.</p>
        <button id="start">Start</button>
        <p class="credit">Built with vibes. Not affiliated with Mojang.</p>
      </div>
    </div>

    <div class="overlay hidden" id="overGame">
      <div class="panel">
        <h1 id="overTitle">Ouch.</h1>
        <p class="stats">
          Score <strong id="finalScore">0</strong>
          <span class="divider">·</span>
          Best <strong id="finalBest">0</strong>
        </p>
        <button id="again">Flap Again</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
